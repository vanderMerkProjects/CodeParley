# CodeParley CI (plan §18.1, §21.2; Linux milestone, plan §1.13; Phase 6 contract §3.5, §3.6, §4): typecheck,
# build and the automated test suite on both supported platforms, both native custodians built and self-tested, and
# the installed-package compatibility tests. Windows and Linux are both release gates: each runs the
# platform-independent tests, the shared contracts (one behaviour, a fixture per platform) and its own platform's
# integration tests; the other platform's are skipped and say so (docs/validation/test-classes.md). Local/live
# validation — a logged-in Codex, Claude hosts, the Codex sandbox self-test with the real Codex, the installed
# custodian services — is not part of CI (plan §18.2, §19; the RC gates, contract §10); see docs/validation/.
name: CI

# When it runs (plan M1.6-7): pull requests, pushes to main and manual runs (Actions tab or
# `gh workflow run CI --ref <branch> [-f expected_sha=<sha>]`); plain branch pushes and documentation-only pushes to
# main do not start it. Every pull request runs it, documentation-only ones included: main's ruleset requires these
# checks on every pull request, and a skipped run never reports them. What runs is the same for every event: the one
# supported Node.js major (package.json engines, the single-runtime policy; test/ci-workflow.test.ts keeps the matrix
# on it) on Windows and Linux, each platform as one verify job and the test job's shards, which together run the whole
# suite (Step 6): its result is all of those jobs'.
# Releases are tagged on main, so the release gate is the push run of the tagged commit (or of the last earlier commit
# that changed more than documentation).
on:
  push:
    branches: [main]
    # Documentation only: Markdown at the repository root, docs/ and the spike's Markdown. Other
    # Markdown still runs CI: prompts/codex-reviewer.md is the reviewer prompt the product loads
    # at run time and the tests render.
    paths-ignore: ["*.md", "*.MD", "docs/**", "spike/**/*.md"]
  pull_request:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Optional: the full 40-character id the selected ref's head must be (contract §4.2); the run fails on any other head"
        required: false
        default: ""

# The default read-only token and nothing else: no job uses a secret, a signing key or a deployment credential, and
# no job needs Docker (contract §4.3).
permissions:
  contents: read

# A newer run cancels the one it supersedes: a new commit on a pull request, or a new manual run
# on the same branch. Pushes to main are grouped by commit, so a later merge does not cancel
# them: each merge's own run is the release gate for its commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

# Runner labels (contract §4.3, O-10): repository variables CP_LINUX_RUNNER and CP_WINDOWS_RUNNER name the runners;
# unset, the jobs run on GitHub's ubuntu-24.04 and windows-latest. Linux is pinned to Ubuntu 24.04, the supported Linux
# platform: `ubuntu-latest` moves to Ubuntu 26.04 from 2026-10-19 (GitHub's announced migration), which CodeParley does
# not yet support. Changing the variables is the owner's runner decision, not this file's.
jobs:
  # CI verifies its own input (contract §4.2 step 4). The commit under test comes from the event alone, the same way in
  # every job: a pull request's head, a push's commit, or the head of the ref a manual run was started on. A manual
  # run's expected_sha selects nothing: when given, the run fails unless it names that head. This job checks the commit
  # and its signature by the owner's key committed in .github/ci/commit-signing-key.asc; the verify and test jobs confirm
  # they have the commit it verified.
  identity:
    name: Commit identity
    runs-on: ${{ vars.CP_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # A merge GitHub made carries GitHub's signature; its merged head (the second parent) is verified instead.
          fetch-depth: 2
          persist-credentials: false

      # No npm cache here: the job needs no packages, and automatic caching would follow the package.json of the commit
      # under test.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          package-manager-cache: false

      - name: Verify the commit and its signature
        id: verify
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REQUESTED_SHA: ${{ inputs.expected_sha }}
          MERGE: ${{ github.event_name == 'push' && '--allow-github-merge' || '' }}
        run: |
          node scripts/ci/verify-commit-identity.mjs --expect "$EXPECTED_SHA" --requested "$REQUESTED_SHA" $MERGE
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Step 6: what each platform and Node.js version checks once, on a runner of its own while the test job's shards run
  # the suite: typecheck and build, the platform's custodian built from this commit and self-tested, the Windows
  # diagnostic, the install smoke test and the plugin check.
  verify:
    name: ${{ matrix.platform }} · Node ${{ matrix.node }} · verify
    needs: identity
    runs-on: ${{ matrix.platform == 'windows' && (vars.CP_WINDOWS_RUNNER || 'windows-latest') || (vars.CP_LINUX_RUNNER || 'ubuntu-24.04') }}
    # Windows: an estimated 6 minutes (setup, the custodian build, its self-tests 2, the diagnostic 1, the install smoke
    # test 1.5); Linux: about 1. A limit keeps a hung run from burning Actions minutes; it does not make a slow step pass.
    timeout-minutes: ${{ matrix.platform == 'windows' && 30 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        # The supported runtime (package.json engines): Node.js 26 LTS only, the same for every event.
        include:
          - { platform: linux, node: 26.x }
          - { platform: windows, node: 26.x }
    env:
      CI: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      # The repository is stored with LF line endings; keep them on Windows runners too.
      - name: Keep the repository's line endings
        run: git config --global core.autocrlf false

      # Selected from the event, as in the identity job, not from that job's output; the next step confirms it is the
      # commit the identity job verified.
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Confirm the verified commit
        shell: bash
        env:
          VERIFIED_SHA: ${{ needs.identity.outputs.sha }}
        run: |
          head=$(git rev-parse HEAD)
          if [ -z "$VERIFIED_SHA" ] || [ "$head" != "$VERIFIED_SHA" ]; then
            echo "::error::HEAD $head is not the commit the identity job verified (${VERIFIED_SHA:-none})"
            exit 1
          fi

      # The npm cache, only where its scope fits the code: a push to main runs a signed commit already on main, and a pull
      # request's cache is written to the pull request's own ref. A manual run can test the head of any branch it is
      # started on, in that branch's scope, so it neither restores nor saves the cache. Automatic caching stays off: it
      # would follow the package.json of the commit under test.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: ${{ github.event_name != 'workflow_dispatch' && 'npm' || '' }}
          package-manager-cache: false

      # The SDK custodian/global.json pins (10.0.403, latest feature band of 10.0.4xx or later, no previews).
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: custodian/global.json

      - name: Versions
        run: |
          git rev-parse HEAD
          node --version
          npm --version
          git --version
          dotnet --version

      - name: Install dependencies (exactly the lockfile)
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Layer B (contract §3.5): the platform's custodian, built from this commit; its `version` verb reports the
      # release version, the build commit and the protocol.
      - name: Build the Windows custodian
        if: runner.os == 'Windows'
        run: dotnet build custodian/CodeParley.Custodian/CodeParley.Custodian.csproj -c Release

      - name: Build the Linux custodian
        if: runner.os == 'Linux'
        run: dotnet build custodian/CodeParley.Custodian.Linux/CodeParley.Custodian.Linux.csproj -c Release

      # The self-tests that need no installed service (Windows) or no provisioned system (Linux); the installed
      # custodians are verified on the native VMs (contract §10).
      - name: Custodian self-tests (Windows)
        if: runner.os == 'Windows'
        run: node scripts/ci/custodian-selftests.mjs --host windows --exe custodian/CodeParley.Custodian/bin/Release/net10.0-windows/CodeParley.Custodian.exe

      - name: Custodian self-tests (Linux)
        if: runner.os == 'Linux'
        run: node scripts/ci/custodian-selftests.mjs --host linux --exe custodian/CodeParley.Custodian.Linux/bin/Release/net10.0/codeparley-custodian

      # Staging diagnostic (TD decision, F-2): the real custodian's run corpus on its own, with the custodian built above.
      # In the first staging run it stalled inside `npm test` on Windows; this tells an effect of the image from one of
      # the suite's concurrency. Step 6: it runs here, alone on a runner that runs no suite, while the same file runs
      # within the suite in one of the test job's shards. A failure here fails the job.
      - name: Custodian run corpus alone (Windows diagnostic)
        if: runner.os == 'Windows'
        run: npx vitest run test/custodian-run.contract.test.ts

      # Layer A (contract §3.5): the packed engine installed clean, globally and into a project, with fault injection
      # and the gate without a custodian (manual review works; a protected loop is refused fail-closed).
      - name: Install smoke test
        run: node scripts/package/smoke.mjs --mode both

      - name: Plugin build and verification
        shell: bash
        run: |
          node plugin/build-plugin.mjs --out "$RUNNER_TEMP/code-parley-plugin"
          node plugin/verify-plugin.mjs "$RUNNER_TEMP/code-parley-plugin"

  # Step 6: the automated suite, in shards that together run every test file once per platform and Node.js version
  # (test/schedule.ts deals the files by their recorded durations): four on Windows, two on Linux.
  test:
    name: ${{ matrix.platform }} · Node ${{ matrix.node }} · tests ${{ matrix.shard }}
    needs: identity
    runs-on: ${{ matrix.platform == 'windows' && (vars.CP_WINDOWS_RUNNER || 'windows-latest') || (vars.CP_LINUX_RUNNER || 'ubuntu-24.04') }}
    # Windows: each shard an estimated 8 minutes (setup and the custodian build about 1.3, a quarter of the suite about
    # 6.5; unsharded, `npm test` took 20 to 29 minutes on GitHub's 4-core runners); Linux: each about 5. A limit keeps a
    # hung run from burning Actions minutes; it does not make a slow test pass.
    timeout-minutes: ${{ matrix.platform == 'windows' && 30 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        # The verify job's platforms, each in shards 1/n to n/n.
        include:
          - { platform: linux, node: 26.x, shard: 1/2 }
          - { platform: linux, node: 26.x, shard: 2/2 }
          - { platform: windows, node: 26.x, shard: 1/4 }
          - { platform: windows, node: 26.x, shard: 2/4 }
          - { platform: windows, node: 26.x, shard: 3/4 }
          - { platform: windows, node: 26.x, shard: 4/4 }
    env:
      CI: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      # The repository is stored with LF line endings; keep them on Windows runners too.
      - name: Keep the repository's line endings
        run: git config --global core.autocrlf false

      # Selected from the event, as in the identity job, not from that job's output; the next step confirms it is the
      # commit the identity job verified.
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Confirm the verified commit
        shell: bash
        env:
          VERIFIED_SHA: ${{ needs.identity.outputs.sha }}
        run: |
          head=$(git rev-parse HEAD)
          if [ -z "$VERIFIED_SHA" ] || [ "$head" != "$VERIFIED_SHA" ]; then
            echo "::error::HEAD $head is not the commit the identity job verified (${VERIFIED_SHA:-none})"
            exit 1
          fi

      # The npm cache under the same rules as in the verify job.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: ${{ github.event_name != 'workflow_dispatch' && 'npm' || '' }}
          package-manager-cache: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: custodian/global.json

      - name: Versions
        run: |
          git rev-parse HEAD
          node --version
          npm --version
          git --version
          dotnet --version

      # What the Linux suite ran on (validation discipline: record the environment). The user
      # namespace settings decide whether the mount-point tests (unshare) can run.
      - name: Linux environment
        if: runner.os == 'Linux'
        run: |
          uname -srm
          grep -E '^(PRETTY_NAME|VERSION_ID)=' /etc/os-release
          echo "user.max_user_namespaces=$(cat /proc/sys/user/max_user_namespaces 2>/dev/null || echo n/a)"
          echo "kernel.apparmor_restrict_unprivileged_userns=$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo n/a)"
          if unshare -rm true 2>/dev/null; then echo "unshare -rm: available"; else echo "unshare -rm: not available (mount-point tests are skipped)"; fi
          git lfs version || echo "git-lfs: not installed"
          df -T "$RUNNER_TEMP" | tail -1

      - name: Install dependencies (exactly the lockfile)
        run: npm ci --no-audit --no-fund

      # The custodian the suite's real-custodian contract tests run (without it they would skip): built from this
      # commit in every shard, as in the verify job.
      - name: Build the Windows custodian
        if: runner.os == 'Windows'
        run: dotnet build custodian/CodeParley.Custodian/CodeParley.Custodian.csproj -c Release

      - name: Build the Linux custodian
        if: runner.os == 'Linux'
        run: dotnet build custodian/CodeParley.Custodian.Linux/CodeParley.Custodian.Linux.csproj -c Release

      # Step 6: CP_TEST_SHARD, the matrix's shard, makes vitest exclude the test files dealt to the other shards of this
      # platform and Node.js version (test/schedule.ts, by their recorded durations). On Windows, CP_TEST_GIT=auto makes
      # the suite find Git for Windows' own binary in the installation of the git on PATH and check it against the stable
      # cmd\git.exe (test/test-git.ts; its location is internal to Git for Windows: mingw64 up to 2.55, ucrt64 from 2.56),
      # then put it first on PATH, so the suite's tens of thousands of git calls skip the launcher (bin\git.exe, a second
      # process per call). If no verified binary is found, the suite runs the git on PATH and logs and annotates the
      # fallback. Tests only: the verify job keeps the runner's PATH. Set on this step only.
      - name: Test
        env:
          CP_TEST_SHARD: ${{ matrix.shard }}
          CP_TEST_GIT: ${{ matrix.platform == 'windows' && 'auto' || '' }}
        run: npm test
